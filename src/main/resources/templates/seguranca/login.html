<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>Entrar · Transbom</title>
    <link rel="stylesheet" th:href="@{/rh/comet-base.css}">
    <link rel="stylesheet" th:href="@{/rh/acesso.css}">
</head>
<body class="acesso">
<main class="login" aria-labelledby="titulo-login">
    <div class="brand login-marca"><th:block th:replace="~{layout/navegacao :: marca}"/></div>
    <section class="panel login-card">
        <header>
            <h1 id="titulo-login">Entrar no painel</h1>
            <p class="muted">Use sua conta para acessar o módulo de mão de obra.</p>
        </header>
        <p class="feedback" data-state="error" role="alert" th:if="${param.error}">Usuário ou senha inválidos.</p>
        <p class="feedback" data-state="success" role="status" th:if="${param.logout}">Você saiu da aplicação.</p>
        <form th:action="@{/login}" method="post">
            <div class="form-field">
                <label for="username">Usuário</label>
                <input id="username" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
            </div>
            <div class="form-field">
                <label for="password">Senha</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
            </div>
            <button class="btn primary" type="submit">Entrar <span aria-hidden="true">→</span></button>
        </form>
    </section>
</main>
</body>
</html>
