<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar | Insights</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f5f7fb; color: #17243a; font-family: Arial, sans-serif; }
        main { width: 100%; max-width: 420px; background: #fff; padding: 36px; border: 1px solid #e6ebf3; border-radius: 15px; box-shadow: 0 12px 35px rgba(23, 36, 58, .08); }
        .marca { color: #2563eb; font-size: .8rem; font-weight: bold; letter-spacing: .12em; text-transform: uppercase; }
        h1 { margin: 18px 0 8px; font-size: 1.8rem; }
        .subtitulo { margin: 0 0 24px; color: #64748b; line-height: 1.5; }
        label { display: block; margin: 18px 0 7px; font-size: .9rem; font-weight: bold; }
        input { display: block; width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 7px; font: inherit; color: inherit; }
        input:focus { outline: 2px solid #93c5fd; outline-offset: 1px; border-color: #2563eb; }
        button { width: 100%; margin-top: 24px; padding: 13px; border: 0; border-radius: 7px; background: #2563eb; color: white; font: inherit; font-weight: bold; cursor: pointer; }
        button:hover { background: #1d4ed8; }
        button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
        .mensagem { margin: 0 0 16px; padding: 12px; border-radius: 7px; font-size: .9rem; line-height: 1.4; }
        .erro { background: #fef2f2; color: #991b1b; }
        .sucesso { background: #f0fdf4; color: #166534; }
        @media (max-width: 480px) { main { padding: 26px 22px; } }
    </style>
</head>
<body>
<main>
    <div class="marca">Insights</div>
    <h1>Entrar</h1>
    <p class="subtitulo">Informe suas credenciais para acessar a aplicação.</p>
    <p class="mensagem erro" th:if="${param.error}" role="alert">Usuário ou senha inválidos.</p>
    <p class="mensagem sucesso" th:if="${param.logout}" role="status">Você saiu da aplicação.</p>
    <form th:action="@{/login}" method="post">
        <label for="username">Usuário</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Entrar</button>
    </form>
</main>
</body>
</html>
